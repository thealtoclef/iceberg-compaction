name: Release Python Package

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: "Runs on"
        default: self-hosted
        required: false
        type: string
      prerelease:
        description: Whether the release is a pre-release
        default: true
        required: false
        type: boolean

jobs:
  call-python-release:
    permissions:
      id-token: write
      contents: write
    uses: thealtoclef/modular-automations/.github/workflows/python-release.yaml@main
    with:
      prerelease: ${{ github.prerelease }}
      publish: true
      directory: python/
      maturin_pep517_args: --manylinux 2_28
